# OmniBenchmark Module Configuration

entrypoints:
  pca: pca.py
  pca-prof: prof.sh pca.py
  knn: knn.py
  knn-prof: prof.sh knn.py
  cluster: cluster_graph.py                 # CLUST stage: graph clustering on neighbors_h5
  cluster-prof: prof.sh cluster_graph.py
  cluster_embedding: cluster_embedding.py   # rapids extra: clusters from pcas_tsv (no plan stage)
  cluster_embedding-prof: prof.sh cluster_embedding.py
# common code (cli engine + stage schemas) vendored into src/common/.
# `pixi run -e dev sync` (from this module root) refreshes it.
templates:
  repo: https://github.com/omni-scrna/boilerplate
  ref: main
  lang: python

# benchmark(s) this module works with
benchmarks:
  - name: split-stages
    repo: https://github.com/omni-scrna/split-stages-plan
    plan: benchmark_conda.yaml
    ref: main

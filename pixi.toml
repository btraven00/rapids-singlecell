[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "rapids-singlecell"
platforms = ["linux-64"]
version = "0.1.0"

# rapids-singlecell is PyPI-only (not on the rapidsai conda channel), and its
# wheels bundle their own CUDA 13 runtime — no `cuda-version` pin needed, but the
# host driver must support CUDA 13.
#
# Take `rapids-singlecell-cu13`, not the plain `rapids-singlecell`: since 0.15 the
# latter is sdist-only, so installing it forces a from-source build of the native
# CUDA extensions (nvcc 13 + cmake + nanobind). The -cu13 dist is the prebuilt
# wheel; it still imports as `rapids_singlecell`.
#
# Do not go back to 0.14.1: it imports `check_array` from
# `cuml.thirdparty_adapters`, which cuML removed by 26.06.
#
# Python is pinned to 3.13; 0.16.x accepts >=3.12,<3.15.

[dependencies]
python = ">=3.13,<3.14"
pip = "*"
# Same pin as the scanpy module: the TSV writers are the same code in both, so
# they must be the same polars (see src/writers._write_tsv).
polars = ">=1,<2"

[pypi-dependencies]
rapids-singlecell-cu13 = { version = "==0.16.1", extras = ["rapids"] }
obkit = ">=0.0.3, <0.0.4"
pytest = ">=8"

[tasks]
tests = "pytest tests/"
check = "python check.py"
validate = "python validators/pca_output.py"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/rapids-singlecell.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/rapids-singlecell.yml"

# env for quick dev tasks - avoid the GPU runtime deps
[feature.dev.dependencies]
python = ">=3.11"
pyyaml = ">=6"
curl = "*"

[feature.dev.tasks]
# refresh src/common/ (cli engine + stage schemas) from boilerplate + plan
sync = "sh -c 'curl -fsSL https://raw.githubusercontent.com/omni-scrna/boilerplate/${BRANCH:-main}/scripts/pull.py | python -'"

[environments]
dev = { features = ["dev"], no-default-feature = true }
